name: CI Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_IMAGE: ghcr.io/${{ github.repository }}-release
  # Matches the Dockerfile's PYTHON_VERSION so tests run on what we ship.
  PYTHON_VERSION: '3.13'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest -q

  # PR or push to main — build artifact with sha tag
  build:
    needs: lint-and-test
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=short
      # Baked into the image and surfaced on /api/info and the app_build_info
      # metric, so a running pod can be traced back to a commit.
      - name: Resolve build metadata
        id: build_meta
        run: |
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"

      # Single-arch load for scanning — Trivy needs a local image, and building
      # both arches here would double the work before we know it is clean.
      - name: Build for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local-scan:latest
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.version }}
            GIT_SHA=${{ steps.build_meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-scan:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.version }}
            GIT_SHA=${{ steps.build_meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Git tag pushed — scan, then promote to release repo
  promote:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source tag
        id: src
        run: echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.src.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      # No rebuild — the already-scanned image is copied to the release repo so
      # the released bits are byte-identical to the tested ones.
      - name: Promote to release repo
        run: |
          docker buildx imagetools create \
            -t ${{ env.RELEASE_IMAGE }}:${{ github.ref_name }} \
            ${{ env.IMAGE }}:${{ steps.src.outputs.tag }}
